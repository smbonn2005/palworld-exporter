[project]
name = "palworld-exporter"
version = "2.0.0"
description = "Prometheus exporter for Palword Server"
readme = "README.md"
requires-python = ">=3.9"

license = { file = "LICENSE" }
keywords = ["palworld", "prometheus", "exporter"]

authors = [
    { name = "Robert Bost", email = "bostrt@gmail.com" },
    { name = "Stephen Bonnell", email = "stephen@smbonn.me" },
]

maintainers = [
    { name = "Robert Bost", email = "bostrt@gmail.com" },
    { name = "Stephen Bonnell", email = "stephen@smbonn.me" },
]

# Classifiers help users find your project by categorizing it.
#
# For a list of valid classifiers, see https://pypi.org/classifiers/
classifiers = [
    "Development Status :: 2 - Pre-Alpha",

    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",

    "License :: OSI Approved :: MIT License",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3 :: Only",

    "Topic :: System :: Monitoring",
    "Topic :: Games/Entertainment",
]

dependencies = [ # Optional
    "click>=8",
    "click-loglevel>=0.5",
    "prometheus-client>=0.19,<0.20",
    "requests>=2,<3",
    "get_version>=3.5",
]

[project.optional-dependencies]
test = ["flake8", "coverage", "pytest", "pyfakefs"]

[project.urls]
"Homepage" = "https://github.com/smbonn2005/palworld-exporter"
"Bug Reports" = "https://github.com/smbonn2005/palworld-exporter/issues"
#"Funding" = "https://donate.pypi.org"
#"Say Thanks!" = "http://saythanks.io/to/example"
"Source" = "https://github.com/smbonn2005/palworld-exporter/"

[project.scripts]
palworld_exporter = "palworld_exporter.main:main"

[build-system]
# These are the assumed default build requirements from pip:
# https://pip.pypa.io/en/stable/reference/pip/#pep-517-and-518-support
requires = ["setuptools>=43.0.0", "wheel"]
build-backend = "setuptools.build_meta"
